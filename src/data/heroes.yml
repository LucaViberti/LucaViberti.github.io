# Hero rosters, generated by tools/extract_heroes.py.
# Hero names, portraits and skill names stay in English by site convention,
# so they live here once; the sentences are in src/i18n/heroes/<lang>.yml.
# 'role' is one of the ids in 'roles' - the label for each is translated.
roles:
- dps
- tank
- support
- healer
- tank_dps
- support_dps
- healer_support
