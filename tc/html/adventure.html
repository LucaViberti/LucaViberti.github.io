<script>
document.addEventListener('DOMContentLoaded', function () {
  const icons = {
    "League": "/images/league-symbol.jpeg",
    "聯盟": "/images/league-symbol.jpeg",
    "Nature": "/images/nature-symbol.jpeg",
    "自然": "/images/nature-symbol.jpeg",
    "Horde": "/images/horde-symbol.jpeg",
    "部落": "/images/horde-symbol.jpeg"
  };
  function addIcon(el, word) {
    const img = document.createElement('img');
    img.src = icons[word];
    img.alt = word + ' symbol';
    img.style.height = '1em';
    img.style.marginLeft = '0.3em';
    el.appendChild(img);
  }
  document.querySelectorAll('a').forEach(function (a) {
    const t = a.textContent.trim();
    if (icons[t]) addIcon(a, t);
  });
  document.querySelectorAll('h1,h2,h3,h4,h5,h6').forEach(function (h) {
    const t = h.textContent.trim();
    if (icons[t]) addIcon(h, t);
  });
});
</script>
